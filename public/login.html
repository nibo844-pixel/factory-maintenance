<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Σύνδεση — Factory Maintenance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }
        .login-icon { text-align: center; font-size: 3rem; margin-bottom: 12px; }
        h1 { font-size: 1.3rem; text-align: center; color: #1f2937; margin-bottom: 4px; }
        .subtitle { text-align: center; font-size: .85rem; color: #6b7280; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: .82rem; font-weight: 600; color: #374151; margin-bottom: 5px; }
        input {
            width: 100%; padding: 11px 14px; border: 1.5px solid #d1d5db;
            border-radius: 10px; font-size: .92rem; outline: none; transition: border .2s;
        }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        button[type="submit"] {
            width: 100%; padding: 12px; background: #2563eb; color: white;
            border: none; border-radius: 10px; font-size: .95rem; font-weight: 600;
            cursor: pointer; transition: background .2s; margin-top: 8px;
        }
        button[type="submit"]:hover { background: #1d4ed8; }
        button[type="submit"]:disabled { opacity: .6; cursor: not-allowed; }
        .error { background: #fef2f2; color: #dc2626; padding: 10px 14px; border-radius: 8px;
            font-size: .85rem; margin-bottom: 16px; display: none; border: 1px solid #fecaca; }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-icon">🏭</div>
        <h1>Factory Maintenance</h1>
        <p class="subtitle">Σύστημα Διαχείρισης Συντήρησης</p>
        <div class="error" id="error"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label>Κωδικός</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" id="loginBtn">🔓 Είσοδος</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('error');
            errEl.classList.remove('show');
            btn.disabled = true;
            btn.textContent = 'Σύνδεση...';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Σφάλμα σύνδεσης');
                window.location.href = '/';
            } catch(err) {
                errEl.textContent = err.message;
                errEl.classList.add('show');
                btn.disabled = false;
                btn.textContent = '🔓 Είσοδος';
            }
        });
    </script>
</body>
</html>
